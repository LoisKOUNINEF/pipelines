  ${APP_LOWER}-${STACK_NAME}-client:
    image: ghcr.io/${IMAGE_LOWER}-client:image-placeholder
    networks:
      - traefik-public
      - default
    environment:
      NODE_ENV: "production"
      PORT: "${CLIENT_PORT}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${CLIENT_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-client.rule=(Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)) && PathPrefix(`/`)"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-client.entrypoints=websecure"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-client.tls.certresolver=letsencrypt"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-client.service=${APP_LOWER}-${STACK_NAME}-client"
__MIDDLEWARE_LABELS__
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-client.middlewares=hsts-header@swarm,${APP_LOWER}-${STACK_NAME}-www@swarm"
        - "traefik.http.services.${APP_LOWER}-${STACK_NAME}-client.loadbalancer.server.port=${CLIENT_PORT}"


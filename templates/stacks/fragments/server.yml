  ${APP_LOWER}-${STACK_NAME}-server:
    image: ghcr.io/${IMAGE_LOWER}-server:image-placeholder
    networks:
      - traefik-public
      - default
    environment:
      NODE_ENV: "production"
      PORT: "${SERVER_PORT}"
__DB_ENV__
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SERVER_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      # scaled up by scale-backend.sh once the stack is healthy (SERVER_REPLICAS)
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-server.rule=(Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)) && __SERVER_RULE__"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-server.entrypoints=websecure"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-server.tls.certresolver=letsencrypt"
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-server.service=${APP_LOWER}-${STACK_NAME}-server"
__MIDDLEWARE_LABELS__
        - "traefik.http.routers.${APP_LOWER}-${STACK_NAME}-server.middlewares=hsts-header@swarm,${APP_LOWER}-${STACK_NAME}-www@swarm"
        - "traefik.http.services.${APP_LOWER}-${STACK_NAME}-server.loadbalancer.server.port=${SERVER_PORT}"
__DB_SECRETS__


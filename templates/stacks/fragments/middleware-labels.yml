        - "traefik.http.middlewares.hsts-header.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.hsts-header.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.hsts-header.headers.stsPreload=true"
        # www.<domain> is only served to redirect it (301) to <domain>, so pages exist on one host.
        # "$$" escapes "$" from docker stack's interpolation, so Traefik gets its capture groups as "$" + "{1}".
        - "traefik.http.middlewares.${APP_LOWER}-${STACK_NAME}-www.redirectregex.regex=^https://www\\.([^/]+)/(.*)"
        - "traefik.http.middlewares.${APP_LOWER}-${STACK_NAME}-www.redirectregex.replacement=https://$${1}/$${2}"
        - "traefik.http.middlewares.${APP_LOWER}-${STACK_NAME}-www.redirectregex.permanent=true"
